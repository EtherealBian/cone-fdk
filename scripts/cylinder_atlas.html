<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>圆柱展开台 · ConeFDK</title>
<style>
:root { color-scheme:dark; --bg:#161b1b; --dim:#b1b8b3; --ink:#f4f0df; --line:#404745; --accent:#f7ba65; --mint:#a1dccc; font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}
* { box-sizing:border-box}
body { margin:0; background:var(--bg); color:var(--ink)}
main { max-width:1120px; margin:auto; padding:30px clamp(16px,4vw,56px) 22px}
header,footer,.row,.scale { display:flex; align-items:center; justify-content:space-between; gap:1em}
header,footer { border-block-end:1px solid var(--line); padding-bottom:12px}
.code,.scale,output,#xyz,#dist,#pos { font: .81rem/1.5 ui-monospace,Consolas,monospace; font-variant-numeric:tabular-nums}
.code { letter-spacing:.12em; color:var(--mint)}
h1 { font-size:clamp(29px,5vw,56px); font-weight:560; letter-spacing:-.04em; margin:18px 0 0}
h1 span { font:italic .61em/1 Georgia,serif; color:var(--accent); white-space:nowrap}
.intro { margin:4px 0 20px; color:var(--dim)}
#work { display:grid; grid-template-columns:minmax(0,1fr) 216px; border-block:1px solid var(--line)}
figure { margin:0; padding:16px 20px 12px 0}
.row { font-size:.79rem; color:var(--dim)}
#stage { position:relative; background:#080c0c; margin:8px 0; cursor:crosshair; line-height:0}
canvas { width:100%; height:auto; touch-action:manipulation}
canvas:focus-visible,button:focus-visible,input:focus-visible { outline:2px solid var(--mint); outline-offset:3px}
.scale { color:var(--dim); font-size:.7rem}
.hint { font-size:.83rem; color:var(--dim); margin:12px 0 0}
.panel { border-left:1px solid var(--line); padding:18px 0 10px 20px}
.panel h2 { font-size:1rem; font-weight:580; margin:0}
.panel>div+div { margin-top:20px}
#ring { width:88px; height:88px; display:block; margin:9px 0}
.controls { display:grid; grid-template-columns:1fr 1fr; gap:30px; padding:14px 0}
.controls label { display:block; font-size:.84rem}
.controls output { color:var(--accent)}
input[type=range] { width:100%; accent-color:var(--accent); margin:8px 0 0}
#dist { font-size:1.3rem; color:var(--accent); margin:4px 0}
#xyz,#pos { color:var(--mint); margin:3px 0}
button { font:inherit; font-size:.75rem; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:4px; padding:4px 10px; cursor:pointer}
footer { border-block-end:0; border-top:1px solid var(--line); padding-top:11px; color:var(--dim); font-size:.7rem; flex-wrap:wrap}
a { color:inherit}
#status { color:var(--accent)}
@media(max-width:760px) { #work { grid-template-columns:1fr}
figure { padding:12px 0}
.panel { border-left:none; border-top:1px solid var(--line); padding:12px 0; display:grid; grid-template-columns:1fr 1fr; gap:10px}
#ring { display:none}
.panel>div+div { margin-top:0}
.controls { gap:14px}
header .code { font-size:.65rem}
}
</style>
<main>
<header><b class="code">CONEFDK / FIELD ATLAS</b><span class="code">SPECIMEN 01 · WALNUT</span>
</header>
<h1>圆柱展开台 <span>The unwrapped walnut</span>
</h1>
<p class="intro">在核桃内部取一层圆柱面，摊开来看。图的左右两端在试件上相邻；拖动半径，可以换到更里层或外层。</p>
<div id="work">
<figure>
<div class="row"><b>圆周 × 轴向</b><span id="extent"></span>
</div>
<div id="stage">
<canvas id="sheet" tabindex="0" aria-label="核桃展开图。方向键移动探针，回车选点，Esc 清尺。">
</canvas>
</div>
<div class="scale"><span id="left"></span><span id="mid"></span><span id="right"></span>
</div>
<figcaption class="hint">单击两点测同一圆柱上的最短表面距离，可跨接缝。键盘：方向键移动，Enter 取点，Esc 清尺。</figcaption>
</figure>
<aside class="panel">
<div>
<h2>坐标探针</h2>
<svg id="ring" viewBox="-54 -54 108 108" aria-hidden="true"><circle r="45" fill="none" stroke="#48524f" stroke-dasharray="2 5"/><path d="M-48 0H48M0 -48V48" stroke="#343d39"/><circle id="orbit" fill="none" stroke="#a1dccc"/><path id="spoke" stroke="#f7ba65"/><circle id="spot" r="4" fill="#f7ba65"/>
</svg>
<p id="pos">
</p>
<p id="xyz">
</p>
</div>
<div>
<h2>曲面尺</h2>
<p id="dist" aria-live="polite">— mm</p>
<p class="hint" id="status">请选择起点 A</p><button id="clear" type="button">清除两点</button>
</div>
</aside>
</div>
<section class="controls">
<label for="shell"><span class="row"><b>取样半径</b><output id="radius"></output></span><input id="shell" type="range" min="0" step="1">
</label>
<label for="seam"><span class="row"><b>显示接缝</b><output id="phase"></output></span><input id="seam" type="range" min="0" step="1" value="0">
</label>
</section>
<footer><span>720 个实测投影 · 固定灰度窗 · 显示为 8 位预览，非衰减测量</span><span>Data: A. Meaney, University of Helsinki · <a href="https://doi.org/10.5281/zenodo.6986012">dataset</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · CUDA reconstruction / cylindrical sampling</span>
</footer>
</main>
<script id="data" type="application/json">@@ATLAS@@</script>
<script>
'use strict';
const el = id => document.getElementById(id), data = JSON.parse(el('data').textContent),
      [D, H, W] = data.shape_rha;
const cv = el('sheet'), ctx = cv.getContext('2d'), mod = (x, n) => ((x % n) + n) % n,
      diff = (b, a) => mod(b - a + W / 2, W) - W / 2;
const shell = el('shell'), seam = el('seam');
shell.max = D - 1;
shell.value = Math.floor(D / 2);
seam.max = W - 1;
cv.width = W;
cv.height = H;
let i0 = Math.floor(W / 2), j0 = Math.floor(H / 2), pins = [];
const images = data.frames.map(b => {
  const im = new Image();
  im.onload = draw;
  im.src = 'data:image/png;base64,' + b;
  return im
});
const rad = () => data.first_radius_mm + (+shell.value) * data.radial_step_mm,
      z = j => (j - (H - 1) / 2) * data.axial_pitch_mm, ang = i => i * 2 * Math.PI / W;
const deg = i => (i * 360 / W).toFixed(1) + '°', fmt = x => x.toFixed(2), put = (id, txt) => {
  el(id).textContent = txt
};
function draw() {
  const k = +shell.value, a = +seam.value, r = rad(), im = images[k], th = ang(i0);
  ctx.clearRect(0, 0, W, H);
  if (im.complete && im.naturalWidth) {
    ctx.drawImage(im, -a, 0);
    if (a) ctx.drawImage(im, W - a, 0)
  }
  const xp = p => mod(p[0] - a, W) + .5, yp = p => p[1] + .5;
  if (pins.length === 2) {
    let [A, B] = pins, x = xp(A);
    ctx.strokeStyle = '#ffcb7d';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let shift of [-W, 0, W]) {
      ctx.moveTo(x + shift, yp(A));
      ctx.lineTo(x + shift + diff(B[0], A[0]), yp(B))
    }
    ctx.stroke()
  }
  pins.forEach((p, n) => {
    let x = xp(p), y = yp(p);
    ctx.fillStyle = '#ffc478';
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, 7);
    ctx.fill();
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('AB'[n], x > W - 14 ? x - 12 : x + 4, y < 13 ? y + 12 : y - 3)
  });
  let x = mod(i0 - a, W) + .5, y = j0 + .5;
  ctx.strokeStyle = '#a1dccc';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - 4, y);
  ctx.lineTo(x + 4, y);
  ctx.moveTo(x, y - 4);
  ctx.lineTo(x, y + 4);
  ctx.stroke();
  put('extent',
      `${W} × ${H} · 上 −${fmt((H - 1) * data.axial_pitch_mm / 2)} / 下 +${
          fmt((H - 1) * data.axial_pitch_mm / 2)} mm`);
  put('radius', fmt(r) + ' mm');
  put('phase', deg(a));
  put('left', deg(a));
  put('mid', deg(mod(a + W / 2, W)));
  put('right', deg(a) + ' ↻');
  put('pos', deg(i0) + ' · 轴向 ' + fmt(z(j0)) + ' mm');
  let xyz = data.center_mm.map(
      (c, k) => c + z(j0) * data.axis_unit[k] +
          r * (Math.cos(th) * data.seam_unit[k] + Math.sin(th) * data.tangent_unit[k]));
  put('xyz', 'XYZ (' + xyz.map(fmt).join(', ') + ') mm');
  const R = 42 * r / (data.first_radius_mm + (D - 1) * data.radial_step_mm);
  el('orbit').setAttribute('r', R);
  el('spoke').setAttribute('d', `M0 0L${R * Math.cos(ang(a))} ${- R * Math.sin(ang(a))}`);
  el('spot').setAttribute('cx', R * Math.cos(th));
  el('spot').setAttribute('cy', -R * Math.sin(th));
  put('dist',
      pins.length === 2 ?
          Math.hypot(r * ang(diff(pins[1][0], pins[0][0])), z(pins[1][1]) - z(pins[0][1]))
                  .toFixed(3) +
              ' mm' :
          '— mm');
  put('status', ['请选择起点 A', '请选择终点 B', 'A → B · 短弧；再点重选'][pins.length]);
}
function probe(e) {
  const b = cv.getBoundingClientRect();
  i0 =
      mod(Math.min(W - 1, Math.max(0, Math.floor((e.clientX - b.left) * W / b.width))) +
              (+seam.value),
          W);
  j0 = Math.min(H - 1, Math.max(0, Math.floor((e.clientY - b.top) * H / b.height)));
}
function pin() {
  if (pins.length === 2) pins = [];
  pins.push([i0, j0]);
  draw()
}
cv.onpointermove = e => {
  probe(e);
  draw()
};
cv.onclick = e => {
  probe(e);
  pin()
};
cv.onkeydown = e => {
  if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Enter', 'Escape'].includes(e.key))
    return;
  e.preventDefault();
  if (e.key === 'Enter') return pin();
  if (e.key === 'Escape') pins = [];
  if (e.key === 'ArrowLeft') i0 = mod(i0 - 1, W);
  if (e.key === 'ArrowRight') i0 = mod(i0 + 1, W);
  if (e.key === 'ArrowUp') j0 = Math.max(0, j0 - 1);
  if (e.key === 'ArrowDown') j0 = Math.min(H - 1, j0 + 1);
  draw()
};
shell.oninput = () => {
  pins = [];
  draw()
};
seam.oninput = draw;
el('clear').onclick = () => {
  pins = [];
  draw()
};
draw();
</script></html>
