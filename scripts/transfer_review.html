<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>跨试件边界校准 · 离线切片复核</title><style>
*{box-sizing:border-box}body{margin:0;background:#091719;color:#e2eae8;font:16px/1.6 system-ui,sans-serif}main{max-width:1020px;margin:auto;padding:clamp(14px,3vw,36px)}header>small{letter-spacing:.17em;color:#8ccfc0}h1{margin:.25em 0 0;font-size:clamp(1.5rem,4vw,2.5rem)}p{max-width:82ch;color:#bed0cc}label{display:block;font-weight:650}select,input{width:100%;accent-color:#7ee5ca}select,button{background:#173133;color:#edf5ed;border:1px solid #688b84;border-radius:4px;padding:.5em;font:inherit}button{cursor:pointer}fieldset{border:1px solid #315250;padding:12px 16px;margin:1em 0}output{font-variant-numeric:tabular-nums}section{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{min-width:0;margin:0}canvas{display:block;image-rendering:pixelated;width:100%;max-height:50vh;object-fit:contain;background:#050d0e}figcaption{font-size:.9rem;color:#c0d5ce;padding:.3em 0}.key{color:#ecbb6d}#detail{min-height:2.5em}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffce77}@media(max-width:450px){main{padding:12px}section{gap:6px}figcaption{font-size:.8rem}}
</style><main><header><small>MEASUREMENT LAB / TRANSFER CONTROL</small><h1>一层切片，四张对照</h1><p id="meta"></p></header><fieldset><legend>定位到一个孔</legend><label for="cases">参考孔或未匹配预测</label><select id="cases"></select><p id="detail" aria-live="polite"></p><label for="slider">源 TIFF：<output id="z"></output></label><input id="slider" type="range" step="1" min="0" value="0"><button id="prev" type="button">上一层</button> <button id="next" type="button">下一层</button></fieldset><section aria-label="同坐标切片"><figure><canvas width="256" height="256"></canvas><figcaption>01 · 原始灰度（统一窗宽）</figcaption></figure><figure><canvas width="256" height="256"></canvas><figcaption>02 · NIST 数字标注，蓝色</figcaption></figure><figure><canvas width="256" height="256"></canvas><figcaption>03 · 候选 E 基线，绿色</figcaption></figure><figure><canvas width="256" height="256"></canvas><figcaption>04 · 跨件修正；绿色保留，橙色新增，紫色移除</figcaption></figure></section><p><span class="key">黄色框</span>标出所选三维孔的包围范围。每个像素对应一个原始体素的横截面。计数取自完整三维连通体；“未匹配”不等于没有局部重叠。只检查符合资格的预测或参考孔。开发实验，不是物理尺寸认证。</p><p>来源：Felix H. Kim 等，NIST，DOI 10.18434/M32162。对源图裁剪、窗宽变换、分割和着色；无机构背书。文件可离线使用。</p></main>

'use strict';const D=JSON.parse(document.querySelector('#data').textContent), el=id=>document.getElementById(id),sel=el('cases'),sl=el('slider'),cs=[...document.querySelectorAll('canvas')],off=document.createElement('canvas');off.width=off.height=256;const ox=off.getContext('2d',{willReadFrequently:true});sl.max=D.layers.length-1;el('meta').textContent=`试件 ${D.i} · x=[360,616)，y=[376,632)，z=[256,352)。所有面板使用同一坐标和原图窗宽 ${D.window.join('–')}。`;for(const [j,row] of D.cases.entries())sel.add(new Option(row.title,j));let seq=0;
async function draw(){const ticket=++seq, k=Number(sl.value), c=D.cases[Number(sel.value)], img=new Image();el('z').textContent=String(k+256).padStart(4,'0');el('detail').textContent=c.note;el('prev').disabled=k===0;el('next').disabled=k===Number(sl.max);img.src='data:image/png;base64,'+D.layers[k];await img.decode();if(ticket!==seq)return;ox.drawImage(img,0,0);const pix=ox.getImageData(0,0,256,256).data;const colors=[[112,198,255],[92,231,175],[255,165,62],[226,132,244]];for(const [j,cv] of cs.entries()){const ctx=cv.getContext('2d'),dst=ctx.createImageData(256,256);for(let q=0;q<pix.length;q+=4){const g=pix[q],f=pix[q+1]>>5,ref=f&1,b=f&2,a=f&4;const tint=j===1&&ref?colors[0]:j===2&&b?colors[1]:j===3?(a?(b?colors[1]:colors[2]):b?colors[3]:null):null;for(let h=0;h<3;h++)dst.data[q+h]=tint?Math.round(.34*g+.66*tint[h]):g;dst.data[q+3]=255}ctx.putImageData(dst,0,0);if(c.box&&k>=c.box[0]&&k<c.box[1]){let [,,y0,y1,x0,x1]=c.box;ctx.strokeStyle='#ffd373';ctx.lineWidth=1;ctx.strokeRect(x0-1.5,y0-1.5,x1-x0+3,y1-y0+3)}}document.body.dataset.rendered=String(k)}
function refresh(){draw().catch(e=>{el('detail').textContent='切片读取失败：'+e.message})}sel.onchange=()=>{sl.value=D.cases[Number(sel.value)].peak;refresh()};sl.oninput=refresh;for(const [id,d] of [['prev',-1],['next',1]])el(id).onclick=()=>{sl.value=Number(sl.value)+d;refresh()};sel.onchange();
</script></html>
